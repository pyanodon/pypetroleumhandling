bitumen-seep=[entity=bitumen-seep]n können auf der Karte generieren und markieren unterirdische Kohlenwasserstoffvorkommen. Über diese Stellen kann man einen [entity=oil-derrick-mk01], [entity=tar-extractor-mk01] oder [entity=natural-gas-derrick-mk01] plazieren.\n\nZunächst muss dieses Gebäude mit einer Bohrflüssigkeit wie [fluid=drilling-fluid-0] versorgt werden. Zu diesem Zeitpunkt produziert das Gebäude noch nichts, da noch gebohrt werden muss bis es schließlich die unterirdische Lagerstätte erreicht. Das Gebäude benötigt nun keine Bohrflüssigkeit mehr, sondern liefert stattdessen [fluid=crude-oil], [fluid=tar] oder [fluid=raw-gas], je nachdem, welches Gebäude plaziert wurde.\n\nDie Menge der generierten Ressourcen hängt ab von:\n - Die Stufe der Bohrflüssigkeit B ((zwischen 1 und 4) ^ 2 pro verbrauchte Flüssigkeitseinheit).\n - Die Stufe des Gebäudes G ((zwischen 1 und 4) ^ 2).\n - Eine Zufallszahl Z zwischen 4 und 16.\n\nDie Anzahl der Bohrzyklen beträgt dann 6400 * B * G * Z.\n\nJeder Bohrzyklus ergibt 100 Einheiten der gewünschten Flüssigkeit. Die Geschwindigkeit des Gebäudes bestimmt die Anzahl der Bohrzyklen pro Sekunde. Da die Fördermenge von der Menge der verbrauchten Bohrflüssigkeit und der Gebäudestufe abhängt, verbrauchen langsamere Bohranlagen mehr Bohrflüssigkeit, was zu einer höheren Fördermenge führt. Bohranlagen höherer Stufen gleichen dies durch einen höheren G-Multiplikator aus, doch wenn die Bohrgeschwindigkeit darüber hinaus erhöht wird, verringert sich die Gesamtmenge der förderbaren flüssigkeit.\n[color=255,0,0]Der Abriss oder das Upgrade eines Bohrturms setzt den gesamten Fortschritt zurück![/color]

tholin=Nauvis' atmosphere is rich in tholins, which can be used to craft a variety of gases. Um [fluid=tholins] zu erzeugen, müsse eine  [item=capsule] mit einer Rakete aus einem [entity=rocket-silo] geschossen werden. Diese sammelt die in der Atmosphäre vorhandenen Tholine, die dann zur Weiterverarbeitung dienen.\n\nTholine können zu einer Vielzahl von nützlichen Gasen verarbeitet werden:\n\n[technology=tholin-mk01]:\n[fluid=carbon-dioxide] [fluid=nitrogen] [fluid=hydrogen]\n\n[technology=tholin-mk02]:\n[fluid=chlorine] [fluid=acetylene] [fluid=acidgas] [fluid=ammonia] [fluid=carbon-dioxide] [fluid=benzene]\n\n[technology=tholin-mk03]:\n[fluid=cyanic-acid] [fluid=carbon-dioxide] [fluid=ethylene] [fluid=methane] [fluid=syngas] [fluid=acetone]\n[fluid=methanal] [fluid=methanol] [fluid=propene] [fluid=refsyngas]\n\n[technology=tholin-mk04]:\n[fluid=deuterium] [fluid=glycerol] [fluid=helium3] [fluid=olefin] [fluid=tritium]
